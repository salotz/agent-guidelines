# Host tools checked by ./.bootstrap/host-tool-check (not mise-managed pins).
# Format: whitespace-separated columns, # comments, blank lines ignored.
#
#   name    min_version    class
#
# name         command on PATH
# min_version  dotted numeric minimum (e.g. 2.30.0); use - for "any if present"
# class        required | optional
#
# required → missing or too-old fails the check
# optional → missing or too-old is a warning only
#
# mise-installed CLIs (hk, …) live in mise.toml, not here.

git     2.30.0    required
mise    2024.1.0  required
